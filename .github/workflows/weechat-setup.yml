name: Build Weechat-Setup.exe
on:
  workflow_dispatch:
  push:
    paths: ["desktop/engine/**", ".github/workflows/weechat-setup.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow pyinstaller
      - name: Modèles IA + caméra virtuelle
        run: |
          New-Item -ItemType Directory -Force build-assets/models/models/buffalo_l, build-assets/vcam | Out-Null
          curl.exe -L --retry 5 -o build-assets/models/inswapper_128.onnx https://huggingface.co/ezioruan/inswapper_128.onnx/resolve/main/inswapper_128.onnx
          curl.exe -L --retry 5 -o buffalo_l.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
          Expand-Archive buffalo_l.zip -DestinationPath build-assets/models/models/buffalo_l -Force
          curl.exe -L --retry 5 -o build-assets/vcam/UnityCaptureFilter64.dll https://github.com/schellingb/UnityCapture/raw/master/Install/UnityCaptureFilter64.dll
          curl.exe -L --retry 5 -o build-assets/vcam/UnityCaptureFilter32.dll https://github.com/schellingb/UnityCapture/raw/master/Install/UnityCaptureFilter32.dll
      - name: Application (PyInstaller)
        run: pyinstaller --noconfirm --windowed --name Weechat --collect-all insightface --collect-all onnxruntime --collect-all pyvirtualcam --collect-data albumentations weechat_app.py
      - name: Installateur (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" weechat-setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Weechat-Setup
          path: dist-installer/Weechat-Setup.exe
      - name: Publier en Release publique
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weechat-latest
          name: Weechat pour Windows
          body: Installateur Weechat pour Windows 10/11.
          make_latest: true
          files: desktop/engine/dist-installer/Weechat-Setup.exe
